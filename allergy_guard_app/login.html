<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllergyGuard — เข้าสู่ระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="authWrap">
    <div id="pgLogin" class="auth-bg">
      <div class="auth-card">
        <div class="auth-hd">
          <div class="auth-ico">🫁</div>
          <h1 class="auth-ttl">AllergyGuard</h1>
          <p class="auth-sub">ระบบดูแล ติดตาม และป้องกันโรคภูมิแพ้ครบวงจร</p>
        </div>
        <div class="fg"><label>อีเมล</label><input type="email" id="lEm" placeholder="your@gmail.com"></div>
        <div class="fg"><label>รหัสผ่าน</label><input type="password" id="lPw" placeholder="••••••••"
            onkeydown="if(event.key==='Enter')doLogin()"></div>
        <div id="lErr" class="err-box hidden">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
        <button class="btn-main" onclick="doLogin()">เข้าสู่ระบบ →</button>
        <div class="or-l">หรือ</div>
        <div class="sw-l">ยังไม่มีบัญชี? <a onclick="showAuth('reg')">สมัครฟรีเลย →</a></div>
        <div class="demo-box">🔑 ทดลอง: <b>demo@allergy.com</b> / <b>demo1234</b></div>
      </div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
