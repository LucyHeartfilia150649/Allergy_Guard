services:
  allergy-guard:
    build: .
    expose:
      - "5000"
    environment:
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ADMIN_DB: ${ADMIN_DB:-/app/data/allergyguard.db}
    volumes:
      - allergy_data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - allergy-guard

volumes:
  allergy_data:
